<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1F3B"/>
      <stop offset="1" stop-color="#14141A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#6E8BFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6E8BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E8BFF"/>
      <stop offset="1" stop-color="#FF8FB1"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#glow)"/>

  <!-- app window -->
  <g transform="translate(150 110)">
    <rect width="1300" height="800" rx="28" fill="#F4F2EC"/>
    <rect width="1300" height="64" rx="28" fill="#E6E3DA"/>
    <rect y="36" width="1300" height="28" fill="#E6E3DA"/>
    <circle cx="40" cy="32" r="9" fill="#FF8FB1"/>
    <circle cx="70" cy="32" r="9" fill="#F7C873"/>
    <circle cx="100" cy="32" r="9" fill="#8FF0C8"/>
    <text x="650" y="40" text-anchor="middle" font-size="22" fill="#3A3A44" font-weight="600">Prepwire — Mock Interview</text>

    <!-- sidebar -->
    <rect x="0" y="64" width="300" height="736" fill="#ECE9E1"/>
    <text x="32" y="120" font-size="20" font-weight="700" fill="#14141A">Sessions</text>
    <g font-size="18" fill="#3A3A44">
      <rect x="20" y="146" width="260" height="56" rx="12" fill="url(#iris)"/>
      <text x="40" y="181" fill="#fff" font-weight="600">Frontend · React</text>
      <text x="40" y="243">Data Structures</text>
      <text x="40" y="299">System Design</text>
      <text x="40" y="355">HR · Behavioural</text>
    </g>
    <text x="32" y="460" font-size="16" fill="#3A3A44">Progress</text>
    <rect x="32" y="476" width="236" height="12" rx="6" fill="#D9D5CB"/>
    <rect x="32" y="476" width="170" height="12" rx="6" fill="url(#iris)"/>

    <!-- chat -->
    <g transform="translate(340 100)">
      <rect width="560" height="110" rx="20" fill="#fff"/>
      <circle cx="40" cy="40" r="20" fill="url(#iris)"/>
      <path d="M40 28 l4 8 8 4 -8 4 -4 8 -4 -8 -8 -4 8 -4z" fill="#fff"/>
      <text x="76" y="46" font-size="20" font-weight="600" fill="#14141A">AI Interviewer</text>
      <text x="76" y="80" font-size="19" fill="#3A3A44">How does React reconcile the virtual DOM?</text>

      <rect x="300" y="140" width="580" height="110" rx="20" fill="#6E8BFF"/>
      <text x="326" y="186" font-size="19" fill="#fff">It diffs the new tree against the old one</text>
      <text x="326" y="220" font-size="19" fill="#fff">and patches only what changed, using keys…</text>

      <rect y="280" width="560" height="74" rx="20" fill="#fff"/>
      <circle cx="40" cy="317" r="20" fill="url(#iris)"/>
      <circle cx="96" cy="317" r="6" fill="#B8B4AA"/>
      <circle cx="116" cy="317" r="6" fill="#B8B4AA"/>
      <circle cx="136" cy="317" r="6" fill="#B8B4AA"/>
    </g>

    <!-- feedback card -->
    <g transform="translate(940 380)">
      <rect width="320" height="330" rx="22" fill="#14141A"/>
      <text x="28" y="50" font-size="20" font-weight="700" fill="#F4F2EC">Feedback</text>
      <text x="28" y="120" font-size="64" font-weight="800" fill="url(#iris)">8.4</text>
      <text x="150" y="120" font-size="20" fill="#B8B4AA">/ 10</text>
      <g font-size="16" fill="#D9D5CB">
        <text x="28" y="172">Clarity</text>
        <rect x="28" y="184" width="264" height="10" rx="5" fill="#2A2A33"/>
        <rect x="28" y="184" width="220" height="10" rx="5" fill="#8FF0C8"/>
        <text x="28" y="230">Depth</text>
        <rect x="28" y="242" width="264" height="10" rx="5" fill="#2A2A33"/>
        <rect x="28" y="242" width="180" height="10" rx="5" fill="#6E8BFF"/>
        <text x="28" y="288">Examples</text>
        <rect x="28" y="300" width="264" height="10" rx="5" fill="#2A2A33"/>
        <rect x="28" y="300" width="150" height="10" rx="5" fill="#FF8FB1"/>
      </g>
    </g>

    <!-- input -->
    <rect x="340" y="720" width="560" height="56" rx="28" fill="#fff" stroke="#D9D5CB"/>
    <text x="372" y="755" font-size="18" fill="#9A968C">Type your answer…</text>
    <circle cx="870" cy="748" r="20" fill="url(#iris)"/>
  </g>
  <rect y="960" width="1600" height="140" fill="#14141A" opacity="0.55"/>
</svg>
