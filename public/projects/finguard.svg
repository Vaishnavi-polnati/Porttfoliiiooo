<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2A26"/>
      <stop offset="1" stop-color="#14141A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#8FF0C8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8FF0C8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E8BFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6E8BFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#glow)"/>

  <g transform="translate(110 90)">
    <!-- header -->
    <text x="0" y="40" font-size="34" font-weight="800" fill="#F4F2EC">FinGuard AI</text>
    <text x="236" y="40" font-size="22" fill="#8FF0C8">● Fraud monitor</text>
    <rect x="1180" y="6" width="200" height="48" rx="24" fill="#8FF0C8"/>
    <text x="1280" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#14141A">Run batch</text>

    <!-- KPI tiles -->
    <g font-size="18" fill="#B8B4AA">
      <rect y="90" width="430" height="150" rx="22" fill="#1E1E26"/>
      <text x="28" y="134">ROC-AUC</text>
      <text x="28" y="206" font-size="56" font-weight="800" fill="#F4F2EC">0.928</text>
      <rect x="475" y="90" width="430" height="150" rx="22" fill="#1E1E26"/>
      <text x="503" y="134">Average Precision</text>
      <text x="503" y="206" font-size="56" font-weight="800" fill="#F4F2EC">0.669</text>
      <rect x="950" y="90" width="430" height="150" rx="22" fill="#1E1E26"/>
      <text x="978" y="134">F1-score</text>
      <text x="978" y="206" font-size="56" font-weight="800" fill="#F4F2EC">0.646</text>
    </g>

    <!-- risk chart -->
    <rect y="280" width="760" height="420" rx="22" fill="#1E1E26"/>
    <text x="28" y="326" font-size="20" font-weight="700" fill="#F4F2EC">Fraud risk over time</text>
    <g stroke="#2E2E38" stroke-width="2">
      <line x1="28" y1="420" x2="732" y2="420"/>
      <line x1="28" y1="520" x2="732" y2="520"/>
      <line x1="28" y1="620" x2="732" y2="620"/>
    </g>
    <path d="M28 600 L110 560 L190 580 L270 500 L350 520 L430 430 L510 470 L590 390 L670 420 L732 360 L732 670 L28 670Z" fill="url(#area)"/>
    <path d="M28 600 L110 560 L190 580 L270 500 L350 520 L430 430 L510 470 L590 390 L670 420 L732 360" fill="none" stroke="#6E8BFF" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="590" cy="390" r="10" fill="#FF8FB1"/>
    <circle cx="430" cy="430" r="10" fill="#FF8FB1"/>

    <!-- SHAP -->
    <rect x="800" y="280" width="580" height="420" rx="22" fill="#1E1E26"/>
    <text x="828" y="326" font-size="20" font-weight="700" fill="#F4F2EC">SHAP · why flagged</text>
    <g font-size="17" fill="#D9D5CB">
      <line x1="1090" y1="350" x2="1090" y2="680" stroke="#3A3A44" stroke-width="2"/>
      <text x="828" y="388">TransactionAmt</text>
      <rect x="1090" y="372" width="230" height="24" rx="6" fill="#FF8FB1"/>
      <text x="828" y="440">card4 · device</text>
      <rect x="1090" y="424" width="170" height="24" rx="6" fill="#FF8FB1"/>
      <text x="828" y="492">addr1 distance</text>
      <rect x="1090" y="476" width="120" height="24" rx="6" fill="#FF8FB1"/>
      <text x="828" y="544">C13 frequency</text>
      <rect x="1010" y="528" width="80" height="24" rx="6" fill="#6E8BFF"/>
      <text x="828" y="596">email domain</text>
      <rect x="980" y="580" width="110" height="24" rx="6" fill="#6E8BFF"/>
      <text x="828" y="648">hour of day</text>
      <rect x="1090" y="632" width="70" height="24" rx="6" fill="#FF8FB1"/>
    </g>

    <!-- table -->
    <rect y="740" width="1380" height="150" rx="22" fill="#1E1E26"/>
    <g font-size="18" fill="#D9D5CB">
      <text x="28" y="790">TXN-30419</text><text x="300" y="790">$1,284.00</text><text x="560" y="790">card · mobile</text>
      <rect x="1180" y="766" width="160" height="34" rx="17" fill="#FF8FB1"/>
      <text x="1260" y="790" text-anchor="middle" font-weight="700" fill="#14141A">High 0.91</text>
      <text x="28" y="850">TXN-30422</text><text x="300" y="850">$42.50</text><text x="560" y="850">card · desktop</text>
      <rect x="1180" y="826" width="160" height="34" rx="17" fill="#8FF0C8"/>
      <text x="1260" y="850" text-anchor="middle" font-weight="700" fill="#14141A">Low 0.04</text>
    </g>
  </g>
  <rect y="960" width="1600" height="140" fill="#14141A" opacity="0.6"/>
</svg>
