<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E1A33"/>
      <stop offset="1" stop-color="#14141A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.7">
      <stop offset="0" stop-color="#FF8FB1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF8FB1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6E8BFF"/><stop offset="1" stop-color="#8FF0C8"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8FB1"/><stop offset="1" stop-color="#F7C873"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14141A"/><stop offset="1" stop-color="#6E8BFF"/></linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6E8BFF"/><stop offset="1" stop-color="#FF8FB1"/></linearGradient>
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/><feColorMatrix values="0 0 0 0 0.9 0 0 0 0 0.9 0 0 0 0 0.95 0 0 0 0.9 0"/></filter>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#glow)"/>

  <!-- prompt bar -->
  <g transform="translate(160 90)">
    <rect width="1280" height="90" rx="45" fill="#F4F2EC"/>
    <circle cx="48" cy="45" r="24" fill="url(#iris)"/>
    <path d="M48 31 l5 9 9 5 -9 5 -5 9 -5 -9 -9 -5 9 -5z" fill="#fff"/>
    <text x="92" y="54" font-size="24" fill="#3A3A44">Campaign brief: <tspan font-weight="700" fill="#14141A">zero-fee credit card for young professionals</tspan></text>
    <rect x="1110" y="18" width="150" height="54" rx="27" fill="#14141A"/>
    <text x="1185" y="52" text-anchor="middle" font-size="20" font-weight="700" fill="#F4F2EC">Generate</text>
  </g>

  <!-- diffusion steps -->
  <g transform="translate(160 230)" font-size="18" fill="#D9D5CB">
    <rect width="190" height="190" rx="20" filter="url(#noise)"/>
    <text x="95" y="222" text-anchor="middle">step 0</text>
    <rect x="215" width="190" height="190" rx="20" fill="url(#c2)" opacity="0.5"/>
    <rect x="215" width="190" height="190" rx="20" filter="url(#noise)" opacity="0.55"/>
    <text x="310" y="222" text-anchor="middle">step 20</text>
    <path d="M425 95 h30 m-12 -12 l12 12 -12 12" stroke="#FF8FB1" stroke-width="4" fill="none"/>
  </g>

  <!-- generated ad: card -->
  <g transform="translate(640 230)">
    <rect width="380" height="480" rx="26" fill="url(#c2)"/>
    <g transform="translate(60 70) rotate(-8)">
      <rect width="260" height="164" rx="18" fill="#14141A"/>
      <rect x="22" y="40" width="44" height="34" rx="6" fill="#F7C873"/>
      <text x="22" y="132" font-size="18" fill="#F4F2EC" letter-spacing="3">•••• 4821</text>
    </g>
    <text x="34" y="340" font-size="34" font-weight="800" fill="#14141A">Zero fees.</text>
    <text x="34" y="384" font-size="34" font-weight="800" fill="#14141A">Full freedom.</text>
    <rect x="34" y="414" width="150" height="40" rx="20" fill="#14141A"/>
    <text x="109" y="440" text-anchor="middle" font-size="16" font-weight="700" fill="#F4F2EC">Apply now</text>
  </g>

  <!-- generated ad: savings -->
  <g transform="translate(1060 230)">
    <rect width="380" height="230" rx="26" fill="url(#c1)"/>
    <circle cx="300" cy="80" r="44" fill="#F7C873"/>
    <circle cx="270" cy="120" r="44" fill="#F7C873" stroke="#14141A" stroke-opacity="0.2" stroke-width="3"/>
    <text x="30" y="160" font-size="28" font-weight="800" fill="#14141A">Grow 7.1% p.a.</text>
    <text x="30" y="196" font-size="18" fill="#14141A">Segment: savers 25–34</text>

    <rect y="250" width="380" height="230" rx="26" fill="url(#c3)"/>
    <path d="M30 430 L110 380 L180 400 L260 320 L350 290" fill="none" stroke="#8FF0C8" stroke-width="6" stroke-linejoin="round"/>
    <text x="30" y="300" font-size="28" font-weight="800" fill="#F4F2EC">Invest smarter</text>
    <text x="30" y="336" font-size="18" fill="#D9D5CB">Segment: first investors</text>
  </g>

  <!-- segment chips -->
  <g transform="translate(160 500)" font-size="18" font-weight="600">
    <text y="0" font-size="20" fill="#F4F2EC">Customer segments</text>
    <rect y="22" width="200" height="46" rx="23" fill="#2A2A33"/><text x="100" y="52" text-anchor="middle" fill="#FF8FB1">Young pros</text>
    <rect y="82" width="200" height="46" rx="23" fill="#2A2A33"/><text x="100" y="112" text-anchor="middle" fill="#8FF0C8">Savers</text>
    <rect y="142" width="200" height="46" rx="23" fill="#2A2A33"/><text x="100" y="172" text-anchor="middle" fill="#6E8BFF">Investors</text>
  </g>
  <rect y="960" width="1600" height="140" fill="#14141A" opacity="0.6"/>
</svg>
